# spotifyd: Spotify Connect daemon, so the bar can play on this PC without the
# Spotify app. Installed by contrib/omarchy/bar/install.sh. Needs Premium.
# Log in once with `spotifyd authenticate` (browser), then the user service runs it.
[global]
device_name = "Omarchy"
device_type = "computer"
backend = "pulseaudio"
bitrate = 320
volume_normalisation = true
use_mpris = true
# Logged in with OAuth, so no need to advertise this PC on the local network.
disable_discovery = true
cache_path = "@HOME@/.cache/spotifyd"
max_cache_size = 2000000000
