## Ignore the NexiGo N60 webcam microphone (USB 1d6c:0103, port 3-2.4).
## Its audio interface times out (usb_set_interface failed -110); WirePlumber
## blocks in the kernel opening it and stops answering bluetoothd, so
## Bluetooth speakers fail to connect. The camera (video) is not affected.
## Undo: delete this file and run `systemctl --user restart wireplumber`.

monitor.alsa.rules = [
  {
    matches = [
      {
        device.name = "~alsa_card.usb-2M_UVC_CAMERA_NexiGo_N60*"
      }
    ]
    actions = {
      update-props = {
        device.disabled = true
      }
    }
  }
]
