# Sin el hook kms: amdgpu (la Radeon integrada, sin monitor) se carga desde el disco al arrancar, no en
# el initramfs. Con kms, mkinitcpio metía TODO el firmware de amdgpu (~140 MB, todas las generaciones)
# y la UKI pesaba ~290 MB: rEFInd la lee con el driver FAT del firmware y la pantalla quedaba negra
# ~10 s tras elegir Omarchy. El monitor va en la NVIDIA, que sigue en el initramfs (MODULES de nvidia.conf).
# Instalado por contrib/omarchy/boot/install.sh splash; quitar: install.sh remove-splash.
_claude_hooks=()
for _claude_h in "${HOOKS[@]}"; do
  [[ $_claude_h == kms ]] || _claude_hooks+=("$_claude_h")
done
HOOKS=("${_claude_hooks[@]}")
unset _claude_hooks _claude_h
