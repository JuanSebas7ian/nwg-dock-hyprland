# claude 2026-10-07: initramfs con systemd para desbloquear LUKS con el TPM2 (sd-encrypt).
# Lo instala contrib/omarchy/boot/install.sh tpm2. Se lee después de omarchy_hooks.conf y
# omarchy_resume.conf (orden alfabético) y traduce sus hooks a los equivalentes de systemd:
#   udev → systemd, keymap/consolefont → sd-vconsole, encrypt → sd-encrypt,
#   btrfs-overlayfs → sd-btrfs-overlayfs (arrancar snapshots), resume → (lo hace systemd).
# La línea del kernel conserva cryptdevice= (lo usan los snapshots viejos, con initramfs busybox)
# y añade rd.luks.name= (lo usa este). Quitar: borrar este archivo y limine-update.
_claude_hooks=()
_claude_vconsole=0
for _claude_h in "${HOOKS[@]}"; do
  case $_claude_h in
    udev) _claude_hooks+=(systemd) ;;
    keymap | consolefont | sd-vconsole)
      ((_claude_vconsole)) || _claude_hooks+=(sd-vconsole)
      _claude_vconsole=1
      ;;
    encrypt) _claude_hooks+=(sd-encrypt) ;;
    btrfs-overlayfs) _claude_hooks+=(sd-btrfs-overlayfs) ;;
    resume) ;;
    *) _claude_hooks+=("$_claude_h") ;;
  esac
done
HOOKS=("${_claude_hooks[@]}")
unset _claude_hooks _claude_vconsole _claude_h
