# rEFInd: pantalla de inicio con un ícono por sistema operativo (Omarchy, Windows 11).
# Fuente: contrib/omarchy/boot/refind/ del fork; lo instala contrib/omarchy/boot/install.sh refind
# en /boot/EFI/refind/. Limine sigue instalado detrás: es el submenú de Omarchy y el respaldo si
# rEFInd falla (F8 en la BIOS → "Limine").

timeout 4
default_selection "Omarchy"
scanfor manual
use_nvram false
enable_mouse
mouse_size 16
resolution max
showtools reboot,shutdown,firmware
hideui arrows,badges,hints

big_icon_size 192
small_icon_size 48
banner themes/omarchy/background.png
banner_scale fillscreen
selection_big themes/omarchy/selection_big.png
selection_small themes/omarchy/selection_small.png
font themes/omarchy/font.png

# Omarchy arranca su UKI directamente (lleva la línea del kernel dentro, igual que desde Limine).
# Tab, F2 o Insert sobre el ícono muestran las opciones: el menú de Limine con los snapshots.
menuentry "Omarchy" {
    icon /EFI/refind/themes/omarchy/os_omarchy.png
    loader /EFI/Linux/omarchy_linux.efi
    submenuentry "Snapshots y menu completo (Limine)" {
        loader /EFI/limine/limine_x64.efi
    }
}

# Windows 11 en su propia partición EFI del Samsung 980 (PARTUUID).
menuentry "Windows 11" {
    icon /EFI/refind/themes/omarchy/os_windows.png
    volume 8D884047-B96C-43FC-A50A-9B8C1E967D90
    loader /EFI/Microsoft/Boot/bootmgfw.efi
}
