# Bluetooth MT7925 (ASUS ROG STRIX B850-A) no enumera en el USB
# Creado por kernel-param.sh (2026-10-02T15:43:28-05:00). Para deshacer: borrar este archivo y
# ejecutar "sudo limine-update", o elegir el snapshot previo en el menú de Limine.
KERNEL_CMDLINE[default]+=" btusb.enable_autosuspend=0 mt7925e.disable_aspm=1"
