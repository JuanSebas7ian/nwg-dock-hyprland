# Arranque lento: dispositivos USB que no responden (usb 6-11, 3-2.4) hacían esperar ~63 s al initramfs
# Creado por kernel-param.sh (2026-10-02T15:56:25-05:00). Para deshacer: borrar este archivo y
# ejecutar "sudo limine-update", o elegir el snapshot previo en el menú de Limine.
KERNEL_CMDLINE[default]+=" usbcore.initial_descriptor_timeout=1000"
